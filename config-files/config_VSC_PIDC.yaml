    # Denotes a list of algorithms to run. Each has the following parameters:
    #   name: Name of the algorithm. Must be recognized by the pipeline, see
    #       code for acceptable values
    #
    #   should_run: whether or not to run the algorithm
    #
    #   params: any additional, algorithm-specific parameters
    #       should be specified in the params map for a given algorithm
    #
    algorithms:

              
        - name: "PIDC"
          params: 
              should_run: [True]
              

        - name: "GRNBOOST2"
          params: 
              should_run: [False]
              
              
        - name: "PPCOR"
          params: 
              should_run: [False]
              # p-value cutoff
              # Used in parsing output
              pVal: [0.01]
              

        - name: "INFERELATOR"
          params:
              should_run: [False]
              num_bootstraps: [3] #The number of bootstraps to run
              count_minimum: [0.05] #The mean expression value which is required to retain a gene for modeling
              random_seed_min: [40] #The minimum random number seed to use
              random_seed_max: [45] #The maximum random number seed to use
              random_seed_selection: [43] #The random number seed to use for selection
              
              
        - name: "hdWGCNA"
          params:
              should_run: [False]
              run_tf: [False]
              nThreads: [2] # number of threads to use
              nVariableFeatures: [2000]
              clustering_resolution: [0.5]
              metacells_k: [5] # nearest-neighbors parameter in MetacellsByGroups fuction. 25 by default in the fuction
              min_cells_per_metacell: [20] # minimum number of cells per metacell in MetacellsByGroups function. 100 by default in the function
              max_shared_cells: [2] # maximum number of shared cells between two metacells in MetacellsByGroups function. 15 by default in the function
              networkType: ["signed"] # WGCNA network type in TestSoftPowers function
              soft_power: [3] # WGCNA soft-thresholding power in ConstructNetwork function
              delete_grey_module: [True]

              
